# Pre-commit hooks. Install once with `brew install pre-commit && pre-commit install`.
# Every `git commit` then runs these checks before the commit lands.

repos:
  # Catches AKIA-prefixed AWS keys, common API token patterns, etc. The
  # platform repo is public; an accidentally committed secret is world-
  # visible the moment it's pushed. This is the cheapest mitigation.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
